spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/predicta}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true

# URL des tuiles MVT de la source trafic. À fournir en env (SCRAPE_TILE_TEMPLATE) :
# l'URL de la source ne vit pas dans le repo. Placeholders {x} {y} {zoom}.
# Default vide : l'app boote (tests/CI) mais /traffic échoue tant que l'env n'est pas posé.
scrape.tile-template=${SCRAPE_TILE_TEMPLATE:}
# Grille centre + rayon en disque. Defaults = config observée sur la source trafic :
# centre lon/lat [47.52315,-18.90457], zoom mini 13, tuile centrale z13 (5177,4534).
# Bloc de données observé z13 = x[5174..5180] y[4530..4537] ; radius=5 (disque) le couvre.
# Augmenter radius = plus de surface, mais plus de tuiles à fetcher sous le plafond 30 s Lambda.
scrape.center-lon=${SCRAPE_CENTER_LON:47.52315}
scrape.center-lat=${SCRAPE_CENTER_LAT:-18.90457}
scrape.zoom=${SCRAPE_ZOOM:13}
scrape.radius=${SCRAPE_RADIUS:5}
# Rayon réduit pour /traffic/zone (recentrage carte sur un quartier), bien plus léger.
scrape.zone-radius=${SCRAPE_ZONE_RADIUS:2}
# Fetch parallèle des tuiles (sinon ~0,65 s/tuile séquentiel -> timeout API Gateway).
scrape.fetch-parallelism=${SCRAPE_FETCH_PARALLELISM:16}
# Cache en mémoire des réponses /traffic/quartier : TTL court + stale-while-revalidate (on sert le
# snapshot précédent, daté via X-Predicta-Age, le temps du refresh en fond). La source trafic se
# met à jour toutes les ~1-2 min : 45 s est un bon compromis fraîcheur/coût (0 fetch en nominal).
scrape.quartier-cache-ttl-seconds=${SCRAPE_QUARTIER_CACHE_TTL_SECONDS:45}

# Enrichissement OSM des segments trafic (best-effort strict : Overpass down/lent -> no-op,
# /traffic répond toujours). Pose quartierId (point-in-polygon sur relations admin OSM) et comble
# les name vides depuis la rue nommée la plus proche. Index OSM caché en mémoire par conteneur.
scrape.osm.enabled=${SCRAPE_OSM_ENABLED:true}
scrape.osm.overpass-url=${SCRAPE_OSM_OVERPASS_URL:https://overpass-api.de/api/interpreter}
# Seuil mètres au-delà duquel on ne comble PAS un name vide (la rue la plus proche est trop loin).
scrape.osm.name-max-dist-m=${SCRAPE_OSM_NAME_MAX_DIST_M:30}
# TTL du cache OSM. La géo admin/rue bouge rarement -> 24 h ; expiré = on sert le stale + refresh fond.
scrape.osm.ttl-minutes=${SCRAPE_OSM_TTL_MINUTES:1440}
# Attente max du tout 1er load avant de rendre non-enrichi (borne le cold-start, ne bloque pas /traffic).
scrape.osm.ready-timeout-ms=${SCRAPE_OSM_READY_TIMEOUT_MS:300}
# Timeouts du RestClient Overpass dédié (long, distinct du bean tuile 3 s/5 s).
scrape.osm.http-connect-ms=${SCRAPE_OSM_HTTP_CONNECT_MS:3000}
scrape.osm.http-read-ms=${SCRAPE_OSM_HTTP_READ_MS:20000}

# OpenAPI / Swagger UI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.packages-to-scan=com.predicta.mg.endpoint