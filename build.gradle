import org.apache.tools.ant.taskdefs.condition.Os
import org.openapitools.generator.gradle.plugin.tasks.GenerateTask

plugins {
    id 'java'
    id 'org.springframework.boot' version '3.2.2'
    id 'io.spring.dependency-management' version '1.1.3'

    id 'org.openapi.generator' version '7.7.0'

    id 'jacoco'
    id 'checkstyle'

    
}

// ============================================================================================
// Power of Ten (JPL/NASA) — voir docs/power-of-ten.md pour le mapping règle -> outil.
// ============================================================================================

// Le scaffold POJA (@PojaGenerated) est régénéré à chaque déploiement : le corriger ne sert à rien
// et ferait échouer la CI sur du code qui revient tout seul. On l'exclut des analyseurs.
def pojaGeneratedExcludes = [
        '**/concurrency/**',
        '**/datastructure/**',
        '**/endpoint/EndpointConf.java',
        '**/endpoint/RequestLoggerConfigurer.java',
        '**/endpoint/rest/controller/health/**',
        '**/file/**',
        '**/handler/**',
        '**/mail/**',
        '**/PojaApplication.java',
]

checkstyle {
    // Version épinglée : la config ne doit pas changer de comportement toute seule au fil des
    // montées de Gradle.
    toolVersion = '10.12.4'
    configFile = file('config/checkstyle/checkstyle.xml')
    // Zéro tolérance : c'est la règle 10 (« compiler sans aucun warning »).
    maxWarnings = 0
}

tasks.withType(Checkstyle).configureEach {
    exclude pojaGeneratedExcludes
    reports {
        xml.required = true
        html.required = true
    }
}

// Règle 10 : tous les avertissements activés, et une erreur est une erreur.
// `-processing` est retiré : avec des annotations runtime (Spring, JPA, Jackson, Lombok), javac
// signale « no processor claimed these annotations » — un faux positif, pas un défaut de code.
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xlint:all,-processing', '-Werror']
}

jacoco {
    toolVersion = "0.8.11"
}



repositories {

    mavenCentral()
}

java {
    group = 'com.predicta.mg'
    sourceCompatibility = '21'
    targetCompatibility = '21'
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}




test {
    maxParallelForks = Runtime.runtime.availableProcessors().intdiv(2) ?: 1
    useJUnitPlatform()
    finalizedBy jacocoTestCoverageVerification
}

jacocoTestCoverageVerification {
    dependsOn test
    // Le seuil porte sur la suite COMPLÈTE. Un run ciblé (./gradlew test --tests FooTest, très
    // courant pour déboguer et documenté dans le README) ne peut par construction pas l'atteindre :
    // on saute la vérification, le taux reste affiché par le rapport.
    onlyIf { tasks.test.filter.commandLineIncludePatterns.isEmpty() }
    afterEvaluate {
        classDirectories.setFrom(files(classDirectories.files.collect {
            fileTree(dir: it, exclude: [
                    "**/gen/**"
            ])
        }))
    }
    violationRules {
        rule {
            limit {
                counter = "LINE"
                // Power of Ten, règle 5 (les hypothèses doivent être vérifiées) : un seuil à 0 ne
                // vérifie rien — le rapport s'affichait, mais aucune régression de couverture ne
                // pouvait faire échouer la CI.
                //
                // Ratchet : on pose le seuil SOUS le taux mesuré (~82 % sur la suite unitaire) et
                // on ne le baisse JAMAIS. Le relever au fur et à mesure que la couverture monte.
                minimum = 0.70
            }
        }
    }
    finalizedBy jacocoTestReport
}

jacocoTestReport {
    reports {
        xml.required = true
        html.required = true
    }
    afterEvaluate {
        // Need to be duplicated like this from jacocoTestCoverageVerification,
        // else display coverageRate is inconsistent with what was computed during coverage...
        classDirectories.setFrom(files(classDirectories.files.collect {
            fileTree(dir: it, exclude: [
                    "**/gen/**"
            ])
        }))
    }
    doLast {
        def coverageReportFile = file("$rootDir/build/reports/jacoco/test/jacocoTestReport.xml")

        if (coverageReportFile.exists()) {
            def xmlParser = new XmlParser()
            xmlParser.setFeature("http://apache.org/xml/features/nonvalidating/load-external-dtd", false)
            xmlParser.setFeature("http://apache.org/xml/features/disallow-doctype-decl", false)

            def xml = xmlParser.parse(coverageReportFile)

            def lineCounter = xml.'counter'.find { it.@type == 'LINE' }
            if (lineCounter != null) {
                def totalLines = lineCounter.@missed?.toInteger() + lineCounter.@covered?.toInteger() ?: 0
                def coveredLines = lineCounter.@covered?.toInteger() ?: 0
                if (totalLines > 0) {
                    def coverageRate = coveredLines / totalLines.toDouble() * 100
                    println "Total Line Coverage Rate: ${coverageRate.round(2)}%"
                } else {
                    println "No lines were covered or missed in the report."
                }
            } else {
                println "No LINE coverage counter found in the JaCoCo report."
            }
        } else {
            println "No JaCoCo coverage report found. Make sure you run 'gradle test jacocoTestReport' first."
        }
    }
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web:3.2.2'
    testImplementation 'org.testcontainers:testcontainers:2.0.2'

    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.15.3'

    implementation 'com.amazonaws.serverless:aws-serverless-java-container-springboot3:2.1.0'
    implementation 'software.amazon.awssdk:aws-query-protocol:2.20.26'

    implementation 'com.amazonaws:aws-lambda-java-core:1.2.3'
    implementation 'com.amazonaws:aws-lambda-java-events:3.11.3'
    implementation 'software.amazon.awssdk:sqs:2.21.40'
    implementation 'software.amazon.awssdk:eventbridge:2.21.40'
    implementation 'software.amazon.awssdk.crt:aws-crt:0.28.12'
    implementation 'software.amazon.awssdk:ses:2.21.40'
    implementation 'software.amazon.awssdk:core:2.21.40'

    implementation 'jakarta.mail:jakarta.mail-api:2.1.2'
    implementation 'jakarta.activation:jakarta.activation-api:2.1.2'
    implementation 'com.sun.mail:jakarta.mail:2.0.1'
    implementation 'com.sun.activation:jakarta.activation:2.0.1'

    implementation 'org.apache.tika:tika-core:2.9.1'

    implementation 'org.reflections:reflections:0.10.2'

    compileOnly 'org.projectlombok:lombok:1.18.30'
    annotationProcessor 'org.projectlombok:lombok:1.18.30'
    testCompileOnly 'org.projectlombok:lombok:1.18.30'
    testAnnotationProcessor 'org.projectlombok:lombok:1.18.30'

    implementation 'org.openapitools:jackson-databind-nullable:0.2.6'
    implementation 'io.swagger:swagger-annotations:1.6.12'

    testImplementation 'org.springframework.boot:spring-boot-starter-test:3.2.2'
    // Power of Ten (règles 1/3/9) : ce que Checkstyle ne peut pas voir — qui crée des pools de
    // threads, qui détient de l'état statique mutable, qui touche aux internes de la JVM.
    testImplementation 'com.tngtech.archunit:archunit-junit5:1.3.0'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter:2.0.2'
    testImplementation 'org.junit-pioneer:junit-pioneer:2.2.0'

implementation 'org.springframework.boot:spring-boot-starter-data-jpa:3.2.2'
runtimeOnly 'org.postgresql:postgresql:42.7.2'
implementation 'com.google.protobuf:protobuf-java:3.25.3'
implementation 'com.wdtinc:mapbox-vector-tile:3.1.0'
implementation 'org.locationtech.jts:jts-core:1.20.0'
implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.3.0'
implementation 'org.flywaydb:flyway-core:9.22.3'


}
